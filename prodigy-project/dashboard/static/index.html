<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kaspi Markup — Dashboard (демо)</title>
<style>
/*
  Minimal demonstration page: reuses the CSS variable palette and general
  visual language of ../../../index.html's analytics view, but this page is
  NOT a mockup -- every number on it comes from a real fetch() against the
  FastAPI endpoints in dashboard/app.py. Kept intentionally modest (no
  drag-to-reorder blocks, no theme cycling, no i18n) since the point is to
  prove the backend is real and wired up, not to re-pitch the UI again.
*/
:root{
  --red:#F14635;--red2:#d93a2a;
  --bg:#ECEEF1;--w:#FFFFFF;--bd:#DDE1E7;
  --tx:#1C2333;--mu:#6B7280;
  --ok:#22C55E;--ok2:#16a34a;--er:#EF4444;
  --sh:0 1px 3px rgba(0,0,0,.06);
  --f:'Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111318;--w:#1A1D24;--bd:#2C3140;--tx:#E2E8F0;--mu:#8A95A3;
    --sh:0 1px 3px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#111318;--w:#1A1D24;--bd:#2C3140;--tx:#E2E8F0;--mu:#8A95A3;
  --sh:0 1px 3px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--tx);padding:24px;max-width:960px;margin:0 auto}
h1{font-size:16px;font-weight:800;margin-bottom:2px}
.sub{font-size:11px;color:var(--mu);font-family:monospace;margin-bottom:20px}
.card{background:var(--w);border:1px solid var(--bd);border-radius:11px;box-shadow:var(--sh);margin-bottom:18px;overflow:hidden}
.card h2{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);padding:12px 16px;border-bottom:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 12px;font-size:9px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;background:var(--bg);border-bottom:1px solid var(--bd)}
td{padding:9px 12px;border-bottom:1px solid var(--bd)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(241,70,53,.03)}
.proj-link{color:var(--red);cursor:pointer;font-weight:700;background:none;border:none;font-size:12px;text-decoration:underline}
.mono{font-family:monospace}
.err{color:var(--er);font-size:12px;padding:12px 16px}
.muted{color:var(--mu);font-size:11px;padding:12px 16px}
select{border:1px solid var(--bd);border-radius:6px;padding:5px 8px;font-size:12px;background:var(--w);color:var(--tx);margin:0 16px 12px}
</style>
</head>
<body>

<h1>Kaspi Markup — Dashboard</h1>
<div class="sub">read-only demo · fetches dashboard/app.py's /api/* endpoints</div>

<div class="card">
  <h2>Проекты (WER/CER)</h2>
  <table>
    <thead><tr><th>Проект</th><th>Задачи</th><th>WER</th><th>CER</th></tr></thead>
    <tbody id="projTbody"><tr><td colspan="4" class="muted">Загрузка…</td></tr></tbody>
  </table>
</div>

<div class="card">
  <h2>Разметка по дням</h2>
  <select id="projSel"></select>
  <table>
    <thead><tr><th>Дата</th><th>Задач размечено</th><th>Начало</th><th>Окончание</th></tr></thead>
    <tbody id="dailyTbody"><tr><td colspan="4" class="muted">Выберите проект выше</td></tr></tbody>
  </table>
</div>

<script>
// Same-origin by default (FastAPI serves this file as static content); can
// be overridden if this page is ever hosted separately from the API.
const API_BASE = '';

async function loadProjects(){
  const tbody = document.getElementById('projTbody');
  const sel = document.getElementById('projSel');
  try{
    const res = await fetch(API_BASE + '/api/projects');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const projects = await res.json();
    if(!projects.length){
      tbody.innerHTML = '<tr><td colspan="4" class="muted">Нет данных — запустите db/init_db.py и добавьте сессии</td></tr>';
      return;
    }
    tbody.innerHTML = '';
    sel.innerHTML = '';
    projects.forEach(p=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><button class="proj-link" data-id="${esc(p.project_id)}">${esc(p.project_id)}</button></td>` +
        `<td>${p.tasks_count}</td>` +
        `<td class="mono">${p.wer != null ? p.wer + '%' : '—'}</td>` +
        `<td class="mono">${p.cer != null ? p.cer + '%' : '—'}</td>`;
      tbody.appendChild(tr);
      const opt = document.createElement('option');
      opt.value = p.project_id; opt.textContent = p.project_id;
      sel.appendChild(opt);
    });
    tbody.querySelectorAll('.proj-link').forEach(btn=>{
      btn.addEventListener('click', ()=>{ sel.value = btn.dataset.id; loadDaily(btn.dataset.id); });
    });
    if(projects.length){ sel.value = projects[0].project_id; loadDaily(projects[0].project_id); }
    sel.addEventListener('change', ()=> loadDaily(sel.value));
  }catch(e){
    tbody.innerHTML = `<tr><td colspan="4" class="err">Не удалось загрузить /api/projects: ${esc(e.message)}. Дашборд запущен? (uvicorn dashboard.app:app --reload --port 8001)</td></tr>`;
  }
}

async function loadDaily(projectId){
  const tbody = document.getElementById('dailyTbody');
  tbody.innerHTML = '<tr><td colspan="4" class="muted">Загрузка…</td></tr>';
  try{
    const res = await fetch(API_BASE + '/api/projects/' + encodeURIComponent(projectId) + '/daily');
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const rows = await res.json();
    if(!rows.length){
      tbody.innerHTML = '<tr><td colspan="4" class="muted">Нет записей MarkupSession для этого проекта</td></tr>';
      return;
    }
    tbody.innerHTML = '';
    rows.forEach(r=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td><strong>${esc(r.date)}</strong></td><td>${r.tasks}</td>` +
        `<td class="mono">${r.started_at ? esc(r.started_at) : '—'}</td>` +
        `<td class="mono">${r.ended_at ? esc(r.ended_at) : '—'}</td>`;
      tbody.appendChild(tr);
    });
  }catch(e){
    tbody.innerHTML = `<tr><td colspan="4" class="err">Не удалось загрузить /api/projects/${esc(projectId)}/daily: ${esc(e.message)}</td></tr>`;
  }
}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

loadProjects();
</script>
</body>
</html>
